# Quarantine: no repository code, dependencies, or third-party actions are run.
# Explicit manual trigger exists only to expose an inert status message.
name: Quarantine - execution disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: echo "This untrusted fork is data-only; CI execution is disabled."
